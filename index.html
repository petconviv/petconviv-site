<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petconviv Pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="pomodoro-card">
            <h1>Petconviv Pomodoro</h1>
            
            <div class="video-container">
                <iframe 
    id="video-player"
    src="https://www.youtube.com/embed/WMzpO9i3nlc?autoplay=1&mute=1" 
    frameborder="0" 
    allow="autoplay; encrypted-media" 
    allowfullscreen>
</iframe>fullscreen>
</iframe>
            </div>
